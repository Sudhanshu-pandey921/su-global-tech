# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- none

pool:
  name: global-pool

stages:
  - stage: Init
    displayName: Terraform Init

    jobs:
      - job: Init
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'global-sc'
              backendAzureRmStorageAccountName: 'backendstg01'
              backendAzureRmContainerName: 'backend-container01'
              backendAzureRmKey: 'dev.tfstate'

      - job: Plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'global-sc'

      - job: apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-auto-approve'
              environmentServiceNameAzureRM: 'global-sc'
          
