trigger: none

pool:
  name: global-pool

stages:
  - stage: Init
    displayName: Terraform Init
    jobs:
      - job: InitJob
        steps:
          - checkout: self

          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(System.DefaultWorkingDirectory)/azure-platform/environments/dev'
              backendServiceArm: global-sc
              backendAzureRmStorageAccountName: backendstg01
              backendAzureRmContainerName: backend-container01
              backendAzureRmKey: dev.tfstate

  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Init
    jobs:
      - job: PlanJob
        steps:
          - checkout: self

          - task: TerraformTask@5
            displayName: Terraform Init for Plan
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(System.DefaultWorkingDirectory)/azure-platform/environments/dev'
              backendServiceArm: global-sc
              backendAzureRmStorageAccountName: backendstg01
              backendAzureRmContainerName: backend-container01
              backendAzureRmKey: dev.tfstate

          - task: TerraformTask@5
            displayName: Terraform Plan
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '$(System.DefaultWorkingDirectory)/azure-platform/environments/dev'
              environmentServiceNameAzureRM: global-sc

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: ApplyJob
        displayName: Deploy Terraform to Dev

        

        environment: Dev

        strategy:
          runOnce:
            deploy:

         
             steps:
              - checkout: self

              - task: TerraformTask@5
                displayName: Terraform Init for Apply
                inputs:
                  provider: azurerm
                  command: init
                  workingDirectory: '$(System.DefaultWorkingDirectory)/azure-platform/environments/dev'
                  backendServiceArm: global-sc
                  backendAzureRmStorageAccountName: backendstg01
                  backendAzureRmContainerName: backend-container01
                  backendAzureRmKey: dev.tfstate

              - task: TerraformTask@5
                displayName: Terraform Apply
                inputs:
                  provider: azurerm
                  command: apply
                  workingDirectory: '$(System.DefaultWorkingDirectory)/azure-platform/environments/dev'
                  commandOptions: '-auto-approve'
                  environmentServiceNameAzureRM: global-sc


